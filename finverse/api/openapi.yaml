openapi: 3.0.1
info:
  contact:
    email: info@finverse.com
    name: Maintainers
  description: Documentation of the early finverse services
  license:
    name: unknown license
  termsOfService: https://example.com
  title: Finverse Public
  version: 0.0.1
servers:
- url: https://api.prod.finverse.net/
security:
- Oauth2:
  - test
tags:
- description: Publicly accessible endpoints
  name: public
- description: Customer endpoints
  name: customer
- description: Login identity endpoints
  name: login_identity
- description: Link endpoints
  name: link
- description: Payment endpoints
  name: payment
paths:
  /jwks:
    get:
      description: get jwks
      operationId: getCredSubmitJwks
      responses:
        "200":
          content: {}
          description: ok
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBodyModel"
          description: Internal Server Error
      security: []
      tags:
      - public
  /auth/customer/token:
    post:
      description: generate an access_token
      operationId: generateCustomerAccessToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
        description: token request
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: ok
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestModelV2"
          description: Invalid Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestModelV2"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestModelV2"
          description: Internal Server Error
      security: []
      tags:
      - public
      x-codegen-request-body-name: tokenRequest
  /accounts/{accountId}:
    get:
      description: Get a specific account's information
      operationId: getAccount
      parameters:
      - description: The account id
        in: path
        name: accountId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAccountResponse"
          description: Successful
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestModelV2"
          description: Invalid Request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestModelV2"
          description: Internal Server Error
      security:
      - Oauth2:
        - account
      tags:
      - login_identity
  /accounts:
    get:
      description: Get a list of accounts for a login identity
      operationId: listAccounts
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAccountsResponse"
          description: Successful
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestModelV2"
          description: Invalid Request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestModelV2"
          description: Internal Server Error
      security:
      - Oauth2:
        - account
      tags:
      - login_identity
  /card_details:
    get:
      description: Get a list of card details for a login identity
      operationId: listCardDetails
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCardsDetailsResponse"
          description: Successful
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBodyModelV2"
          description: Invalid Request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBodyModelV2"
          description: Internal Server Error
      security:
      - Oauth2:
        - card:get
      tags:
      - login_identity
  /account_numbers/{accountId}:
    get:
      description: Get the account number for a specific account
      operationId: getAccountNumber
      parameters:
      - description: The account id
        in: path
        name: accountId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAccountNumberResponse"
          description: Successful
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestModelV2"
          description: Invalid Request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestModelV2"
          description: Internal Server Error
      security:
      - Oauth2:
        - account_number
      tags:
      - login_identity
  /balance_history/{accountId}:
    get:
      description: Get the balance history for a specific account
      operationId: getBalanceHistory
      parameters:
      - description: The account id
        in: path
        name: accountId
        required: true
        schema:
          type: string
      - description: The source will determine what type of balance history will be
          returned
        in: query
        name: source
        schema:
          enum:
          - INSTITUTION
          - COMPUTED
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetBalanceHistoryResponse"
          description: Successful
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestModelV2"
          description: Invalid Request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestModelV2"
          description: Internal Server Error
      security:
      - Oauth2:
        - balance_history
      tags:
      - login_identity
  /transactions/{accountId}:
    get:
      description: "Get a list of transactions for a particular account. The transactions\
        \ are returned in sorted order, with the most recent one appearing first."
      operationId: listTransactionsByAccountId
      parameters:
      - description: "The account id (ULID, example - 01EP4A1MZDHKETZFRPF0K62S6S)"
        in: path
        name: accountId
        required: true
        schema:
          type: string
      - description: default is 0
        in: query
        name: offset
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: "default is 500, max is 1000"
        in: query
        name: limit
        schema:
          default: 500
          maximum: 1000
          minimum: 1
          type: integer
      - description: "when true, response will be enriched transactions; otherwise\
          \ it will be raw transactions"
        in: query
        name: enrichments
        schema:
          default: false
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTransactionsResponse"
          description: Successful
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestModelV2"
          description: Invalid Request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestModelV2"
          description: Internal Server Error
      security:
      - Oauth2:
        - transaction
      tags:
      - login_identity
  /transactions:
    get:
      description: "Get a list of transactions for a login identity. The transactions\
        \ are returned in sorted order, with the most recent one appearing first."
      operationId: listTransactionsByLoginIdentityId
      parameters:
      - description: default is 0
        in: query
        name: offset
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: "default is 500, max is 1000"
        in: query
        name: limit
        schema:
          default: 500
          maximum: 1000
          minimum: 1
          type: integer
      - description: "when true, response will be enriched transactions; otherwise\
          \ it will be raw transactions"
        in: query
        name: enrichments
        schema:
          default: false
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTransactionsResponse"
          description: Successful
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestModelV2"
          description: Invalid Request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestModelV2"
          description: Internal Server Error
      security:
      - Oauth2:
        - transaction
      tags:
      - login_identity
  /income:
    get:
      description: Get income figures for a login identity
      operationId: getIncomeEstimateByLoginIdentityId
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomeResponse"
          description: Successful
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestModelV2"
          description: Invalid Request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestModelV2"
          description: Internal Server Error
      security:
      - Oauth2:
        - income:get
      tags:
      - login_identity
  /institutions/{institutionId}:
    get:
      description: Get a specific institution by institutionId
      operationId: getInstitution
      parameters:
      - description: The institution id
        in: path
        name: institutionId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Institution"
          description: Successful
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestModelV2"
          description: Invalid Request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestModelV2"
          description: Internal Server Error
      security:
      - Oauth2:
        - institution
      tags:
      - customer
  /institutions:
    get:
      description: Get a list of institutions
      operationId: listInstitutions
      parameters:
      - description: (Deprecated) The country the institution belongs to
        in: query
        name: country
        schema:
          type: string
      - description: The countries the institution belongs to
        explode: false
        in: query
        name: countries
        schema:
          items:
            type: string
          type: array
        style: form
      - description: The products that this institution supports
        in: query
        name: products_supported
        schema:
          type: string
      - description: The type of institution
        in: query
        name: institution_type
        schema:
          enum:
          - BANK
          - WALLET
          - TEST
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListInstitutionsResponse"
          description: Successful
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestModelV2"
          description: Internal Server Error
      security:
      - Oauth2:
        - institution
      tags:
      - customer
  /institutions/customer:
    get:
      description: Get a customer-specific list of institutions for Finverse Link
      operationId: getInstitutionsForCustomer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListInstitutionsResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBodyModelV2"
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBodyModelV2"
          description: Internal Server Error
      security:
      - Oauth2:
        - institution:link
      tags:
      - customer
  /identity:
    get:
      description: "\\[BETA] Get a list of identity data for a given login identity"
      operationId: getIdentity
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetIdentityResponse"
          description: Successful
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestModelV2"
          description: Invalid Request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestModelV2"
          description: Internal Server Error
      security:
      - Oauth2:
        - identity
      tags:
      - login_identity
  /payment_links:
    post:
      description: Create payment link
      operationId: CreatePaymentLink
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentLinkRequest"
        description: Parameters required to create a payment link
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLinkResponse"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBodyModelV2"
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBodyModelV2"
          description: Internal Server Error
      security:
      - Oauth2:
        - paymentlink:create
      tags:
      - payment
      x-codegen-request-body-name: createPaymentLinkRequest
  /payment_links/{paymentLinkId}:
    get:
      description: Get payment link
      operationId: GetPaymentLink
      parameters:
      - description: The payment link id
        in: path
        name: paymentLinkId
        required: true
        schema:
          minLength: 1
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLinkResponse"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBodyModelV2"
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBodyModelV2"
          description: Internal Server Error
      security:
      - Oauth2:
        - paymentlink:get
      tags:
      - payment
  /payment_links/{paymentLinkId}/cancel:
    post:
      description: Cancel a payment link
      operationId: CancelPaymentLink
      parameters:
      - description: The payment link id
        in: path
        name: paymentLinkId
        required: true
        schema:
          minLength: 1
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLinkResponse"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBodyModelV2"
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBodyModelV2"
          description: Internal Server Error
      security:
      - Oauth2:
        - paymentlink:cancel
      tags:
      - payment
  /payment_links/kcp/payment:
    post:
      description: Complete a KCP payment
      operationId: completeKcpPayment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteKcpPaymentRequest"
        description: Parameters from the KCP SDK callback to complete the payment
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteKcpPaymentResponse"
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBodyModelV2"
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBodyModelV2"
          description: Internal Server Error
      security:
      - Oauth2:
        - kcp:completePayment
      tags:
      - payment
      x-codegen-request-body-name: completeKcpPaymentRequest
  /link:
    post:
      description: Create a new link and submit credentials
      operationId: createLink
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiLinkRequest"
        description: Request body for creating a new link and submitting credentials
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetLoginIdentityByIdResponse"
          description: ok
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBodyModel"
          description: Invalid Request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBodyModel"
          description: Internal Server Error
      security:
      - Oauth2:
        - linkApi:create
      tags:
      - link
      x-codegen-request-body-name: apiLinkRequest
  /link/token:
    post:
      description: generate a link token that can be used to create link
      operationId: generateLinkToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkTokenRequest"
        description: token request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkTokenResponse"
          description: ok
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestModelV2"
          description: Invalid Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestModelV2"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestModelV2"
          description: Internal Server Error
      security:
      - Oauth2:
        - link:token
      tags:
      - link
      x-codegen-request-body-name: linkTokenRequest
  /link/relink/{loginIdentityId}:
    post:
      description: Create a new link using an existing LIID
      operationId: relinkV2
      parameters:
      - description: The login identity id
        in: path
        name: loginIdentityId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiRelinkRequest"
        description: Request body for relinking and submitting credentials
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetLoginIdentityByIdResponse"
          description: Service Okay
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBodyModel"
          description: Invalid Request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBodyModel"
          description: Internal Server Error
      security:
      - Oauth2:
        - relinkApi:create
      tags:
      - link
      x-codegen-request-body-name: apiRelinkRequest
  /link/action/{loginIdentityId}:
    post:
      description: Post the user action value
      operationId: linkAction
      parameters:
      - description: The login identity id
        in: path
        name: loginIdentityId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionRequest"
        description: Request body for post link action
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetLoginIdentityByIdResponse"
          description: Service Okay
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBodyModel"
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBodyModel"
          description: Internal Server Error
      security:
      - Oauth2:
        - linkApi:update
      tags:
      - link
      x-codegen-request-body-name: actionRequest
  /link/status/{loginIdentityId}:
    get:
      description: Check the status of a given loginIdentity
      operationId: linkStatus
      parameters:
      - description: The login identity id
        in: path
        name: loginIdentityId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkStatusResponse"
          description: Successful
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBodyModel"
          description: Invalid Request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrBodyModel"
          description: Internal Server Error
      security:
      - Oauth2:
        - linkApi:read
      tags:
      - link
  /auth/token:
    post:
      description: Exchange authorization code for token
      operationId: token
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/token_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
          description: Service Okay
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestModelV2"
          description: Invalid Request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestModelV2"
          description: Internal Server Error
      security:
      - Oauth2:
        - loginIdentity:token
      tags:
      - link
  /auth/token/refresh:
    post:
      description: Refresh an access token
      operationId: refreshToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        description: The refresh token
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
          description: "New refresh, access token"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestModelV2"
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestModelV2"
          description: Internal Server Error
      security:
      - Oauth2:
        - loginIdentity:token
      tags:
      - customer
      x-codegen-request-body-name: refreshRequest
  /login_identity/{loginIdentityId}:
    get:
      description: Get a specific loginIdentity
      operationId: getLoginIdentityById
      parameters:
      - description: The login identity id
        in: path
        name: loginIdentityId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetLoginIdentityByIdResponse"
          description: Successful
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestModelV2"
          description: Invalid Request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestModelV2"
          description: Internal Server Error
      security:
      - Oauth2:
        - loginIdentity:get
      tags:
      - login_identity
  /login_identity/{loginIdentityId}/history:
    get:
      description: Get a history of events for a specific loginIdentity
      operationId: getLoginIdentityHistory
      parameters:
      - description: The login identity id
        in: path
        name: loginIdentityId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetLoginIdentityHistoryResponse"
          description: Successful
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestModelV2"
          description: Invalid Request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestModelV2"
          description: Internal Server Error
      security:
      - Oauth2:
        - loginIdentity:get
      tags:
      - login_identity
  /login_identity:
    delete:
      description: Delete a specific loginIdentity
      operationId: deleteLoginIdentity
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteLoginIdentityResponse"
          description: Successful
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestModelV2"
          description: Invalid Request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestModelV2"
          description: Internal Server Error
      security:
      - Oauth2:
        - loginIdentity:delete
      tags:
      - login_identity
    get:
      description: Get a specific loginIdentity
      operationId: getLoginIdentity
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetLoginIdentityByIdResponse"
          description: Successful
        "400":
          content:
            application/json:
