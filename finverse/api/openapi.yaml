          description: Finverse error code
          example: PAYMENT_METHOD_EXPIRED
          type: string
        message:
          description: Short human-readable error message
          example: Payment method expired
          type: string
        display_details:
          description: Human-readable error detail safe for display to the end user
          example: Please use a different payment method.
          type: string
      required:
      - display_details
      - error_code
      - message
      type: object
    AdyenCardSetupPaymentResponse:
      additionalProperties: true
      description: Raw Adyen /payments or /payments/details JSON response; passed
        directly to Drop-in actions.resolve()
      example:
        error:
          error_code: PAYMENT_METHOD_EXPIRED
          message: Payment method expired
          display_details: Please use a different payment method.
      properties:
        error:
          $ref: "#/components/schemas/FrontendFvErrorModel"
      type: object
    AdyenCardSetupPaymentMethodsResponse:
      additionalProperties: true
      description: Raw Adyen /paymentMethods JSON response; passed directly to Drop-in
        initialisation
      type: object
    SelectPaymentMethodRequest:
      properties:
        payment_account_id:
          description: The payment account ID of the selected payment method
          example: 01ARZ3NDEKTSV4RRFFQ69G5FAV
          type: string
        payment_method_type:
          $ref: "#/components/schemas/PaymentType"
        sender_type:
          $ref: "#/components/schemas/PaymentUserType"
        is_mobile:
          default: false
          description: Whether the user is on mobile device (only makes a difference
            if payment_method_provider is KCP)
          type: boolean
        institution_id:
          description: Optional Finverse institution ID (passed through when selecting
            KCP manual payment flow)
          maxLength: 100
          type: string
        kcp_va_metadata:
          $ref: "#/components/schemas/KcpVaMetadata"
        locale:
          description: "Locale for the payment processor's hosted checkout UI (e.g.\
            \ en-US, zh-TW, ko-KR), mapped from the Finverse Link language. Optional;\
            \ the processor falls back to its default if omitted."
          example: zh-TW
          maxLength: 10
          type: string
      required:
      - payment_account_id
      - payment_method_type
      type: object
    KcpVaMetadata:
      description: KCP virtual account metadata
      properties:
        va_receipt_gubn:
          description: "Cash receipt type; \"0\" = income tax deduction (for individuals),\
            \ \"1\" = proof of expenditure (for businesses)"
          enum:
          - "0"
          - "1"
          type: string
        va_taxno:
          description: ID number for cash receipt issuance
          type: string
      required:
      - va_receipt_gubn
      - va_taxno
      type: object
    SelectPaymentMethodResponse:
      properties:
        token:
          $ref: "#/components/schemas/PaymentLinkTokenResponse"
        card_processor_redirect_uri:
          description: URL to redirect to for making the card payment
          type: string
        mandate_processor_redirect_uri:
          description: URL to redirect to for making the mandate payment (right now
            only for Gocardless)
          type: string
        processor_redirect_uri:
          description: URL to redirect to for making the payment
          type: string
      type: object
